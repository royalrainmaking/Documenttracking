    <script>
        const PLANS = {
            bru: {
                name: 'แผน บรู',
                url: 'https://docs.google.com/spreadsheets/d/1E43wKRlEa1xKM5l_zSDdstmAKPtDgw05rwJVeRLgTYk/export?format=csv&gid=1751324569',
                color: '#198754' // Green
            },
            yut: {
                name: 'แผนยุทธ',
                url: 'https://docs.google.com/spreadsheets/d/1lwDV6QKiJ0nx4guP6T8BhIMquCmwIqzn-zdVnjYa_hc/export?format=csv&gid=1294888219',
                color: '#ffc107' // Yellow
            },
            fun: {
                name: 'แผนฝุ่น',
                url: 'https://docs.google.com/spreadsheets/d/1iOX9ISvptU2UpMbVNPTuYHbA4df11dytCHxFYKoSQxg/export?format=csv&gid=2022149520',
                color: '#dc3545' // Red
            },
            hail: {
                name: 'แผนลูกเห็บ',
                url: 'https://docs.google.com/spreadsheets/d/1SM0GYznjAKPOQT-itypsk83n7l5rx9ibWzKcLGZb4H4/export?format=csv&gid=1068774762',
                color: '#6f42c1' // Purple
            }
        };

        const DB_URL = 'https://docs.google.com/spreadsheets/d/1eTamzpY32FwiJBlti4l49Ff6rWzrnKDopvLi0DsdwXY/export?format=csv&gid=0';
        
        let currentPlan = 'bru';
        let documentData = [];
        let currentTab = 'All';
        let trackingStore = {};
        let selectedMonths = [];
        let selectedDurationsFromControl = [];
        let selectedDurationsFromReceipt = [];
        let selectedDurationsFromModified = [];

        function calculateDaysElapsed(dateStr) {
            const isoDate = getISODate(dateStr);
            if (!isoDate) return null;
            
            const [y, m, d] = isoDate.split('-').map(v => parseInt(v));
            const date = new Date(y, m - 1, d);
            const today = new Date();
            
            const diffTime = today.getTime() - date.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            return diffDays;
        }

        function switchPlan(planId) {
            currentPlan = planId;
            const plan = PLANS[planId];
            
            // Update UI buttons
            document.getElementById('btnPlanBru').classList.toggle('active', planId === 'bru');
            document.getElementById('btnPlanYut').classList.toggle('active', planId === 'yut');
            document.getElementById('btnPlanFun').classList.toggle('active', planId === 'fun');
            document.getElementById('btnPlanHail').classList.toggle('active', planId === 'hail');

            // Update Navbar Color
            const navbar = document.querySelector('.navbar');
            navbar.style.backgroundColor = plan.color;
            navbar.classList.remove('bg-primary'); 
            
            // Adjust text color for yellow (yut)
            if (planId === 'yut') {
                navbar.classList.remove('navbar-dark');
                navbar.classList.add('navbar-light');
            } else {
                navbar.classList.remove('navbar-light');
                navbar.classList.add('navbar-dark');
            }
            
            // Update Title
            const title = `ระบบติดตามเอกสาร - ${plan.name}`;
            document.getElementById('pageTitle').innerText = title;

        async function fetchDatabase() {
            try {
                const response = await fetch(DB_URL);
                if (response.ok) {
                    const csvText = await response.text();
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        transformHeader: h => h.trim(),
                        complete: function(results) {
                            results.data.forEach(row => {
                                const planId = (row.planId || '').trim();
                                const id = (row.id || '').trim();
                                if (planId && id) {
                                    const key = `${planId}-${id}`;
                                    trackingStore[key] = {
                                        step: (row.step || row['ขั้นตอน'] || row['สถานะ'] || '').trim(),
                                        location: (row.location || row['วันที่ได้รับเอกสาร'] || row['วันที่ได้รับ'] || '').trim(),
                                        notes: (row.notes || row['หมายเหตุ'] || row['หมายเหตุเพิ่มเติม'] || '').trim(),
                                        // Handle cases where the lastModified header might be missing or named differently (including Thai)
                                        lastModified: (row.lastModified || row[''] || row['__unnamed__'] || row['วันที่แก้ไขล่าสุด'] || row['เปลี่ยนแปลงล่าสุด'] || '').trim()
                                    };
                                }
                            });
                            renderTable();
                        }
                    });
                }
            } catch (error) {
                console.warn('Sync with database failed:', error);
            }
        }

        async function fetchData() {
            document.getElementById('loading').style.display = 'block';
            // Fetch database sync first
            await fetchDatabase();
            
            try {
                const response = await fetch(PLANS[currentPlan].url);
                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        throw new Error('ไม่ได้รับอนุญาตให้เข้าถึงข้อมูล (กรุณาตั้งค่า Google Sheet ให้เป็นแบบสาธารณะ)');
                    }
                    throw new Error('ไม่สามารถโหลดข้อมูลได้');
                }
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: h => h.trim(),
                    complete: function(results) {
                        processData(results.data);
                        updateTabs();
                        renderTable();
                    },
                    error: function(err) {
                        console.error('Parsing error:', err);
                        alert('เกิดข้อผิดพลาดในการประมวลผลข้อมูล');
                    }
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                alert(error.message);
                // Clear table on error
                documentData = [];
                renderTable();
            }
            document.getElementById('loading').style.display = 'none';
        }

        function processData(data) {
            documentData = data.map(row => {
                let dept = (row['ฝ่าย'] || '').trim();
                // Normalize department names by removing trailing dots (e.g., กกบ. -> กกบ)
                dept = dept.replace(/\.$/, '');
                
                return {
                    id: (row['ลำดับที่'] || '').toString().trim(),
                    bookNum: (row['เลขหนังสือ'] || '').toString().trim(),
                    controlDate: (row['วันที่ลงคุม'] || '').toString().trim(),
                    name: (row['ชื่อผู้เบิก'] || '').toString().trim(),
                    dept: dept,
                    category: row['หมวด'] || '',
                    originalNotes: row['หมายเหตุ'] || '',

            }).filter(item => item.id && item.bookNum);

        function getISODate(dateStr) {
            if (!dateStr || dateStr === '-') return null;
            
            dateStr = dateStr.toString().trim();
            const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            
            // Handle Thai Month Names with spaces (e.g., "5 ก.พ. 26")
            if (dateStr.includes(' ')) {
                const parts = dateStr.split(/\s+/);
                if (parts.length >= 3) {
                    let day = parseInt(parts[0]);
                    let monthIdx = thaiMonths.indexOf(parts[1]);
                    if (monthIdx === -1) {
                        monthIdx = thaiMonths.findIndex(m => parts[1].includes(m.replace('.', '')));
                    }
                    let year = parseInt(parts[2]);

                    if (monthIdx !== -1 && !isNaN(day) && !isNaN(year)) {
                        // Logic: 00-40 is CE, 41-99 is BE
                        // 24, 25, 26 = 2024, 2025, 2026 (CE)
                        // 67, 68 = 2567, 2568 (BE)
                        if (year < 100) {
                            if (year <= 40) year += 2000; // 24 -> 2024 (CE)
                            else year += 2500; // 67 -> 2567 (BE)
                        }
                        
                        if (year > 2400) year -= 543; 
                        
                        const date = new Date(year, monthIdx, day);
                        if (!isNaN(date.getTime())) {
                            const y = date.getFullYear();
                            const m = String(date.getMonth() + 1).padStart(2, '0');
                            const d = String(date.getDate()).padStart(2, '0');
                            return `${y}-${m}-${d}`;
                        }
                    }
                }
            }

            // Handle multiple separators
            const normalized = dateStr.replace(/[-.]/g, '/');

            let date;
            if (normalized.includes('/')) {
                const parts = normalized.split('/');
                if (parts.length < 3) return null;
                
                let day, month, year;
                if (parseInt(parts[0]) > 1000) { // YYYY/MM/DD
                    year = parseInt(parts[0]);
                    month = parseInt(parts[1]) - 1;
                    day = parseInt(parts[2]);
                } else { // DD/MM/YYYY
                    day = parseInt(parts[0]);
                    month = parseInt(parts[1]) - 1;
                    year = parseInt(parts[2]);
                }
                
                if (year < 100) {
                    if (year <= 40) year += 2000; // 24 -> 2024 (CE)
                    else year += 2500; // 67 -> 2567 (BE)
                }
                if (year > 2400) year -= 543; // Convert BE to CE
                
                date = new Date(year, month, day);
            } else {
                // Try standard parsing
                date = new Date(dateStr);
                // If it's a BE year like 2567-02-13, browser might parse it as year 2567
                if (!isNaN(date.getTime()) && date.getFullYear() > 2400) {
                    date = new Date(date.getFullYear() - 543, date.getMonth(), date.getDate());
                }
            }

            if (isNaN(date.getTime())) return null;
            
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function parseMissionEndDate(notes) {
            if (!notes) return null;
            
            const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            const thaiMonthsFull = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            
            let lastDate = null;

            const normalizeYear = (y) => {
                if (y < 100) {
                    if (y <= 40) y += 2000;
                    else y += 2500;
                }
                if (y > 2400) y -= 543;
                return y;
            };

            const getMonthIdx = (str) => {
                let idx = thaiMonths.indexOf(str);
                if (idx === -1) idx = thaiMonths.findIndex(m => str.includes(m.replace('.', '')));
                if (idx === -1) idx = thaiMonthsFull.findIndex(m => str.includes(m));
                return idx;
            };

            // ใช้ Regex ที่รองรับทั้งแบบระบุวันที่ และไม่ระบุวันที่ (เฉพาะเดือน)
            const combinedRegex = /(?:(\d{1,2})\s*)?([ก-๙\.]+)\s*(\d{2,4})/g;
            let match;
            
            while ((match = combinedRegex.exec(notes)) !== null) {
                let day = match[1] ? parseInt(match[1]) : null;
                let monthIdx = getMonthIdx(match[2]);
                let year = normalizeYear(parseInt(match[3]));
                
                if (monthIdx !== -1) {
                    let date;
                    if (day) {
                        date = new Date(year, monthIdx, day);
                    } else {
                        // กรณีมาแค่เดือน -> ให้เป็นวันสุดท้ายของเดือนนั้นๆ
                        date = new Date(year, monthIdx + 1, 0);
                    }
                    
                    date.setHours(0, 0, 0, 0);
                    if (!lastDate || date > lastDate) {
                        lastDate = date;
                    }
                }
            }
            
            return lastDate;
        }

        function formatDateThai(dateStr) {
            const iso = getISODate(dateStr);
            if (!iso) return dateStr || '-';
            
            const [y, m, d] = iso.split('-').map(v => parseInt(v));
            const date = new Date(y, m - 1, d);
            
            const monthNamesShort = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
            const thaiYear = date.getFullYear() + 543;
            const shortThaiYear = thaiYear.toString().slice(-2);
            
            return `${d} ${monthNamesShort[date.getMonth()]} ${shortThaiYear}`;
        }

        function getFilteredData(filter = '') {
            let filteredData = documentData;
            
            // Filter by tab
            if (currentTab !== 'All') {
                filteredData = filteredData.filter(item => item.dept === currentTab);
            }

            // Filter by Checkboxes (Step)
            const checkedSteps = Array.from(document.querySelectorAll('.step-filter:checked')).map(cb => cb.value);
            filteredData = filteredData.filter(item => {
                const key = `${currentPlan}-${item.id}`;
                const tracking = trackingStore[key] || { step: '' };
                const step = tracking.step || 'WAITING';
                
                let filterValue = step;
                if (step.includes('ยกเลิก/ไม่เบิก')) {
                    filterValue = 'ยกเลิก/ไม่เบิก';
                } else if (step === 'ยังไม่ได้รับเอกสารตัวจริง') {
                    filterValue = 'ยังไม่ได้รับเอกสารตัวจริง';
                } else if (step === 'อยู่ระหว่างแก้ไข') {
                    filterValue = 'อยู่ระหว่างแก้ไข';
                } else if (step === 'ยังไม่เสร็จสิ้นภารกิจ') {
                    filterValue = 'ยังไม่เสร็จสิ้นภารกิจ';
                } else if (step === 'กำลังดำเนินการ') {
                    filterValue = 'กำลังดำเนินการ';
                } else if (step === 'ส่งเบิกแล้ว (การเงิน)') {
                    filterValue = 'ส่งเบิกแล้ว (การเงิน)';
                } else if (step !== 'WAITING' && step !== 'ยกเลิก/ไม่เบิก') {
                    filterValue = 'กำลังดำเนินการ';
                }
                
                return checkedSteps.includes(filterValue);
            });

            // Filter by Month
            if (selectedMonths.length > 0) {
                filteredData = filteredData.filter(item => {
                    const docDate = getISODate(item.controlDate);
                    if (!docDate) return false;
                    const [year, month, day] = docDate.split('-').map(v => parseInt(v));
                    return selectedMonths.includes(month.toString());
                });
            }

            // Filter by Duration (Control Date)
            if (selectedDurationsFromControl.length > 0) {
                filteredData = filteredData.filter(item => {
                    const daysElapsed = calculateDaysElapsed(item.controlDate);
                    if (daysElapsed === null) return false;
                    
                    for (let duration of selectedDurationsFromControl) {
                        const durationDays = parseInt(duration);
                        if (daysElapsed >= durationDays) {
                            return true;
                        }
                    }
                    return false;
                });
            }

            // Filter by Duration (Receipt Date)
            if (selectedDurationsFromReceipt.length > 0) {
                filteredData = filteredData.filter(item => {
                    const key = `${currentPlan}-${item.id}`;
                    const tracking = trackingStore[key] || { step: '', location: '', notes: '' };
                    const daysElapsed = calculateDaysElapsed(tracking.location);
                    if (daysElapsed === null) return false;
                    
                    for (let duration of selectedDurationsFromReceipt) {
                        const durationDays = parseInt(duration);
                        if (daysElapsed >= durationDays) {
                            return true;
                        }
                    }
                    return false;
                });
            }

            // Filter by Duration (Modified Date)
            if (selectedDurationsFromModified.length > 0) {
                filteredData = filteredData.filter(item => {
                    const key = `${currentPlan}-${item.id}`;
                    const tracking = trackingStore[key] || { step: '', location: '', notes: '', lastModified: '' };
                    
                    let daysSinceModified = calculateDaysElapsed(tracking.lastModified);
                    
                    // หากไม่มีข้อมูล ให้ถือว่าเป็นเกิน 60 วันไปเลย (ตามโจทย์)
                    if (daysSinceModified === null) {
                        daysSinceModified = 999; // มากกว่า 60
                    }
                    
                    for (let duration of selectedDurationsFromModified) {
                        const durationDays = parseInt(duration);
                        if (daysSinceModified >= durationDays) {
                            return true;
                        }
                    }
                    return false;
                });
            }

            // Filter by Date Range (Control Date)
            const startDate = document.getElementById('startDate').value;
            const endDateRange = document.getElementById('endDate').value;
            if (startDate || endDateRange) {
                console.log('Filtering by date range:', { startDate, endDateRange });
                filteredData = filteredData.filter(item => {
                    const docDate = getISODate(item.controlDate);
                    if (!docDate) {
                        console.log(`Skipping item ${item.bookNum} - invalid date: "${item.controlDate}"`);
                        return false;
                    }
                    
                    const isAfterStart = !startDate || docDate >= startDate;
                    const isBeforeEnd = !endDateRange || docDate <= endDateRange;
                    
                    console.log(`Item ${item.bookNum}: docDate=${docDate}, startDate=${startDate}, match=${isAfterStart && isBeforeEnd}`);

                    if (isAfterStart && isBeforeEnd) {
                        return true;
                    }
                    return false;
                });
                console.log('Results after date filter:', filteredData.length);
            }

            // Filter by Mission Status
            const checkedMissionStatuses = Array.from(document.querySelectorAll('.mission-filter:checked')).map(cb => cb.value);
            if (checkedMissionStatuses.length < 4) { // Only filter if not all are checked (now 4 options)
                filteredData = filteredData.filter(item => {
                    const missionEndDate = parseMissionEndDate(item.originalNotes);
                    let status = 'NODATE';
                    if (missionEndDate) {
                        const today = new Date();
                        today.setHours(0, 0, 0, 0);
                        if (today >= missionEndDate) {
                            const diffTime = today.getTime() - missionEndDate.getTime();
                            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                            status = diffDays > 15 ? 'OVER15' : 'ENDED';
                        } else {
                            status = 'PROGRESS';
                        }
                    }
                    return checkedMissionStatuses.includes(status);
                });
            }

            // Filter by search text
            if (filter) {
                filteredData = filteredData.filter(item => {
                    const searchStr = `${item.bookNum} ${item.controlDate} ${item.name} ${item.dept} ${item.category} ${item.status}`.toLowerCase();
                    return searchStr.includes(filter.toLowerCase());
                });
            }

            return filteredData;
        }

        function normalizeDateForExport(dateStr) {
            if (!dateStr || dateStr === '-') return '-';
            
            let date;
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                let day = parseInt(parts[0]);
                let month = parseInt(parts[1]) - 1;
                let year = parseInt(parts[2]);
                if (year < 100) {
                    if (year <= 40) year += 2000; // 24 -> 2024 (CE)
                    else year += 2500; // 67 -> 2567 (BE)
                }
                if (year >= 2000 && year < 2100) year += 543;
                date = new Date(year - 543, month, day);
            } else {
                date = new Date(dateStr);
            }

            if (isNaN(date)) return dateStr;
            const thaiYear = date.getFullYear() + 543;
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `${day}/${month}/${thaiYear}`;
        }

                if (ws[cellAddress]) {
                    ws[cellAddress].s = filterStyle;
                }
            }
            
            for (let c = 0; c < headers.length; c++) {
                const cellAddress = XLSX.utils.encode_cell({ r: 4, c: c });
                ws[cellAddress].s = headerStyle;
                
                if (!ws[cellAddress]) {
                    ws[cellAddress] = { v: headers[c] };
                }
                ws[cellAddress].s = headerStyle;
            }

            const range = XLSX.utils.decode_range(ws['!ref']);
            for (let r = 5; r <= range.e.r; r++) {
                for (let c = 0; c <= range.e.c; c++) {
                    const cellAddress = XLSX.utils.encode_cell({ r: r, c: c });
                    if (ws[cellAddress]) {
                        ws[cellAddress].s = cellStyle;
                    }
                }
            }

            ws['!cols'] = [
                { wch: 12 },
                { wch: 8 },
                { wch: 15 },
                { wch: 14 },
                { wch: 20 },
                { wch: 12 },
                { wch: 12 },
                { wch: 20 },
                { wch: 14 },
                { wch: 14 },
                { wch: 12 },
                { wch: 20 },
                { wch: 20 }
            ];

            ws['!rows'] = [
                { hpt: 25 },
                { hpt: 20 },
                { hpt: 20 },
                { hpt: 5 },
                { hpt: 25 }
            ];

            XLSX.utils.book_append_sheet(wb, ws, PLANS[currentPlan].name);
            
            const fileName = `export_${currentPlan}_${new Date().toISOString().split('T')[0]}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        function renderTable(filter = '') {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let filteredData = getFilteredData(filter);
            let overdueCount = 0;

            filteredData.forEach(item => {
                const key = `${currentPlan}-${item.id}`;
                const tracking = trackingStore[key] || { 
                    step: '', 
                    location: '',
                    notes: '',
                    lastModified: ''
                };

                // Check for Mission Progress Auto-Step
                const missionEndDate = parseMissionEndDate(item.originalNotes);
                let currentStep = tracking.step;
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                if (missionEndDate && today < missionEndDate) {
                    currentStep = 'ยังไม่เสร็จสิ้นภารกิจ';
                } else if (currentStep === 'ยังไม่เสร็จสิ้นภารกิจ') {
                    // หากจบภารกิจแล้ว หรือไม่พบวัน แต่ค่าเดิมใน DB ยังเป็น "ยังไม่เสร็จสิ้นภารกิจ" ให้เคลียร์เป็นว่าง
                    currentStep = '';
                }

                // Track items older than 30 days since last modification
                const daysSinceModified = calculateDaysElapsed(tracking.lastModified);
                if (daysSinceModified !== null && daysSinceModified >= 30) {
                    overdueCount++;
                }

                const row = document.createElement('tr');
                row.setAttribute('data-key', key);
                
                // Color coding for steps
                let badgeClass = 'bg-secondary';
                if (currentStep === 'กวบ.') badgeClass = 'bg-warning text-dark';
                else if (currentStep === 'ฝบบ.') badgeClass = 'bg-primary';
                else if (currentStep === 'ส่งกลับกลุ่ม/ฝ่าย') badgeClass = 'bg-success';
                else if (currentStep === 'ยังไม่ได้รับเอกสารตัวจริง') {
                    badgeClass = 'bg-info text-dark';
                    row.classList.add('table-info');
                }
                else if (currentStep === 'อยู่ระหว่างแก้ไข') {
                    badgeClass = 'bg-warning text-dark';
                    row.classList.add('table-warning');
                }
                else if (currentStep === 'กำลังดำเนินการ' || currentStep === 'กำลังดำเนินการเบิก') {
                    badgeClass = 'bg-primary';
                    row.classList.add('table-primary');
                }
                else if (currentStep === 'ส่งเบิกแล้ว (การเงิน)') {
                    badgeClass = 'bg-success';
                    row.classList.add('table-success');
                }
                else if (currentStep === 'ยังไม่เสร็จสิ้นภารกิจ') {
                    badgeClass = 'bg-dark text-white';
                    row.classList.add('table-secondary');
                }
                else if (currentStep === 'ยกเลิก/ไม่เบิก') {
                    badgeClass = 'bg-danger';
                    row.classList.add('table-danger');
                }

                const daysElapsed = calculateDaysElapsed(item.controlDate);
                let daysDisplay = '-';
                
                if (daysElapsed !== null) {
                    let icon = '';
                    if (daysElapsed >= 60) {
                        icon = '🚨';
                    } else if (daysElapsed >= 30) {
                        icon = '⚠️';
                    }
                    daysDisplay = `${daysElapsed} วัน ${icon}`;
                }

                const daysElapsedFromReceipt = calculateDaysElapsed(tracking.location);
                let daysFromReceiptDisplay = '-';
                
                if (daysElapsedFromReceipt !== null) {
                    let icon = '';
                    if (daysElapsedFromReceipt >= 60) {
                        icon = '🚨';
                    } else if (daysElapsedFromReceipt >= 30) {
                        icon = '⚠️';
                    }
                    daysFromReceiptDisplay = `${daysElapsedFromReceipt} วัน ${icon}`;
                }

                // Calculate days from Last Modified
                let lastModifiedDisplay = formatDateThai(tracking.lastModified);
                if (daysSinceModified !== null && daysSinceModified >= 30) {
                    lastModifiedDisplay = `<span class="text-danger fw-bold">${lastModifiedDisplay} 🕒</span>`;
                }

                // Check for Mission End Icon and Days Ended
                let missionStatusIcon = '';
                let missionEndedDaysDisplay = '-';
                
                if (missionEndDate) {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    if (today >= missionEndDate) {
                        const diffTime = today.getTime() - missionEndDate.getTime();
                        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                        const titleText = diffDays === 0 ? 'จบภารกิจวันนี้' : `จบภารกิจมาแล้ว ${diffDays} วัน`;
                        
                        // แยกสี icon
                        let icon = '✅'; 
                        if (diffDays > 15) {
                            icon = '✴️'; 
                        }
                        
                        missionStatusIcon = `<span title="${titleText}" style="cursor: help; margin-left: 5px;">${icon}</span>`;
                        missionEndedDaysDisplay = `<strong class="text-danger">${diffDays} วัน</strong>`;
                    }
                }

                row.innerHTML = `
                    <td><input type="checkbox" class="form-check-input row-checkbox" data-key="${key}"></td>
                    <td onclick="openEdit('${key}')">${item.id}</td>
                    <td onclick="openEdit('${key}')">${item.bookNum}</td>
                    <td class="col-date" onclick="openEdit('${key}')">${formatDateThai(item.controlDate)}</td>
                    <td style="text-align: center;" onclick="openEdit('${key}')">
                        <strong>${daysDisplay}</strong>
                    </td>
                    <td onclick="openEdit('${key}')">${item.name}</td>
                    <td onclick="openEdit('${key}')">${item.dept}</td>
                    <td onclick="openEdit('${key}')">
                        <span class="badge ${badgeClass}">${currentStep || '-'}</span>
                        <div style="font-size: 0.75rem; color: #0d6efd; font-weight: bold; margin-top: 2px;">
                            (${lastModifiedDisplay})
                        </div>
                    </td>
                    <td class="col-date" onclick="openEdit('${key}')">
                        ${formatDateThai(tracking.location)}
                    </td>
                    <td style="text-align: center;" onclick="openEdit('${key}')">
                        ${missionEndedDaysDisplay} ${missionStatusIcon}
                    </td>
                    <td class="col-notes" onclick="openEdit('${key}')">
                        <small class="text-danger d-block">${item.status ? '[' + item.status + '] ' : ''}${tracking.notes || ''}</small>
                        ${item.originalNotes || '-'}
                    </td>
                `;
                
                const checkboxCell = row.querySelector('td:first-child');
                checkboxCell.onclick = function(e) { e.stopPropagation(); };
                
                tbody.appendChild(row);
            });

            updateNotification(overdueCount);
            setupSelectAllCheckbox();
        }

        function updateNotification(count) {
            const notificationArea = document.getElementById('notificationArea');
            if (count > 0) {
                notificationArea.innerHTML = `

                `;
            } else {
                notificationArea.innerHTML = '';
            }
        }

            } catch (error) {
                console.error('ไม่สามารถบันทึกลง Database ได้:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            } finally {
                // คืนค่าปุ่ม
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalText;
            }
        }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        renderTable(e.target.value);
    });

    document.querySelectorAll('.step-filter').forEach(cb => {
        cb.addEventListener('change', () => {
            renderTable(document.getElementById('searchInput').value);
        });
    });

    // Initial load
    switchPlan(currentPlan);
</script>

</body>
</html>
