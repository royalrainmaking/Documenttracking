<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบติดตามเอกสาร - แผน บรู</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 30px;
            max-width: 1200px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .status-badge {
            font-size: 0.9em;
            padding: 5px 10px;
            border-radius: 20px;
        }
        .step-active {
            font-weight: bold;
            color: #0d6efd;
        }
        .table-responsive {
            max-height: 600px;
            overflow-y: auto;
        }
        .col-name {
            min-width: 200px;
        }
        .col-date {
            min-width: 150px;
        }
        #docTable tbody tr {
            cursor: pointer;
        }
        #docTable tbody tr:hover {
            background-color: #e9ecef;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .navbar {
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1" id="pageTitle">ระบบติดตามเอกสาร - แผน บรู</span>
        <div class="d-flex">
            <button class="btn btn-outline-light me-2 btn-sm active" id="btnPlanBru" onclick="switchPlan('bru')">แผน บรู</button>
            <button class="btn btn-outline-light me-2 btn-sm" id="btnPlanYut" onclick="switchPlan('yut')">แผนยุทธ</button>
            <button class="btn btn-outline-light btn-sm" id="btnPlanFun" onclick="switchPlan('fun')">แผนฝุ่น</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card p-4">
        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="ค้นหาด้วยเลขหนังสือ ชื่อผู้เบิก หรือฝ่าย...">
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-success" onclick="fetchData()">รีเฟรชข้อมูล</button>
            </div>
        </div>

        <ul class="nav nav-tabs mb-3" id="deptTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="all-tab" onclick="switchTab('All')" type="button">ทั้งหมด</button>
            </li>
        </ul>

        <div id="loading" class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>กำลังโหลดข้อมูล...</p>
        </div>

        <div class="table-responsive">
            <table class="table table-hover" id="docTable">
                <thead class="table-light">
                    <tr>
                        <th>ลำดับ</th>
                        <th>เลขหนังสือ</th>
                        <th class="col-name">ชื่อผู้เบิก</th>
                        <th>ฝ่าย</th>
                        <th>ขั้นตอนปัจจุบัน</th>
                        <th class="col-date">วันที่ได้รับเอกสารตัวจริง</th>
                        <th>หมายเหตุ</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">อัปเดตสถานะเอกสาร</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3">
                    <label class="form-label">ขั้นตอนปัจจุบัน</label>
                    <select id="editStep" class="form-select">
                        <option value="กำลังดำเนินการเบิก">กำลังดำเนินการเบิก</option>
                        <option value="ยกเลิก/ไม่เบิก">ยกเลิก/ไม่เบิก/เบิกไปแล้ว</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">วันที่ได้รับเอกสารตัวจริง</label>
                    <input type="text" id="editLocation" class="form-control" placeholder="เลือกวันที่...">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                <button type="button" id="saveBtn" class="btn btn-primary" onclick="saveChanges()">บันทึก</button>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/th.js"></script>
    <script>
        const PLANS = {
            bru: {
                name: 'แผน บรู',
                url: 'https://docs.google.com/spreadsheets/d/1E43wKRlEa1xKM5l_zSDdstmAKPtDgw05rwJVeRLgTYk/export?format=csv&gid=1751324569',
                color: '#198754' // Green
            },
            yut: {
                name: 'แผนยุทธ',
                url: 'https://docs.google.com/spreadsheets/d/1lwDV6QKiJ0nx4guP6T8BhIMquCmwIqzn-zdVnjYa_hc/export?format=csv&gid=1294888219',
                color: '#ffc107' // Yellow
            },
            fun: {
                name: 'แผนฝุ่น',
                url: 'https://docs.google.com/spreadsheets/d/1iOX9ISvptU2UpMbVNPTuYHbA4df11dytCHxFYKoSQxg/export?format=csv&gid=2022149520',
                color: '#dc3545' // Red
            }
        };

        const DB_URL = 'https://docs.google.com/spreadsheets/d/1eTamzpY32FwiJBlti4l49Ff6rWzrnKDopvLi0DsdwXY/export?format=csv&gid=0';
        
        let currentPlan = 'bru';
        let documentData = [];
        let currentTab = 'All';
        let trackingStore = {};

        function switchPlan(planId) {
            currentPlan = planId;
            const plan = PLANS[planId];
            
            // Update UI buttons
            document.getElementById('btnPlanBru').classList.toggle('active', planId === 'bru');
            document.getElementById('btnPlanYut').classList.toggle('active', planId === 'yut');
            document.getElementById('btnPlanFun').classList.toggle('active', planId === 'fun');

            // Update Navbar Color
            const navbar = document.querySelector('.navbar');
            navbar.style.backgroundColor = plan.color;
            navbar.classList.remove('bg-primary'); 
            
            // Adjust text color for yellow (yut)
            if (planId === 'yut') {
                navbar.classList.remove('navbar-dark');
                navbar.classList.add('navbar-light');
            } else {
                navbar.classList.remove('navbar-light');
                navbar.classList.add('navbar-dark');
            }
            
            // Update Title
            const title = `ระบบติดตามเอกสาร - ${plan.name}`;
            document.getElementById('pageTitle').innerText = title;
            document.title = title;

            // Reset tab and fetch data
            currentTab = 'All';
            fetchData();
        }

        async function fetchDatabase() {
            try {
                const response = await fetch(DB_URL);
                if (response.ok) {
                    const csvText = await response.text();
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            results.data.forEach(row => {
                                if (row.planId && row.id) {
                                    const key = `${row.planId}-${row.id}`;
                                    trackingStore[key] = {
                                        step: row.step || '',
                                        location: row.location || ''
                                    };
                                }
                            });
                            renderTable();
                        }
                    });
                }
            } catch (error) {
                console.warn('Sync with database failed:', error);
            }
        }

        async function fetchData() {
            document.getElementById('loading').style.display = 'block';
            // Fetch database sync first
            await fetchDatabase();
            
            try {
                const response = await fetch(PLANS[currentPlan].url);
                if (!response.ok) {
                    if (response.status === 401 || response.status === 403) {
                        throw new Error('ไม่ได้รับอนุญาตให้เข้าถึงข้อมูล (กรุณาตั้งค่า Google Sheet ให้เป็นแบบสาธารณะ)');
                    }
                    throw new Error('ไม่สามารถโหลดข้อมูลได้');
                }
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        processData(results.data);
                        updateTabs();
                        renderTable();
                    },
                    error: function(err) {
                        console.error('Parsing error:', err);
                        alert('เกิดข้อผิดพลาดในการประมวลผลข้อมูล');
                    }
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                alert(error.message);
                // Clear table on error
                documentData = [];
                renderTable();
            }
            document.getElementById('loading').style.display = 'none';
        }

        function processData(data) {
            documentData = data.map(row => {
                let dept = (row['ฝ่าย'] || '').trim();
                // Normalize department names by removing trailing dots (e.g., กกบ. -> กกบ)
                dept = dept.replace(/\.$/, '');
                
                return {
                    id: row['ลำดับที่'] || '',
                    bookNum: row['เลขหนังสือ'] || '',
                    name: row['ชื่อผู้เบิก'] || '',
                    dept: dept,
                    category: row['หมวด'] || '',
                    originalNotes: row['หมายเหตุ'] || '',
                    status: row['Note'] || ''
                };
            }).filter(item => item.id && item.bookNum);
        }

        function updateTabs() {
            const depts = [...new Set(documentData.map(item => item.dept))].filter(d => d).sort();
            const tabList = document.getElementById('deptTabs');
            
            // Keep "All" tab and remove others
            const allTab = tabList.querySelector('#all-tab').parentElement;
            tabList.innerHTML = '';
            tabList.appendChild(allTab);

            depts.forEach(dept => {
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.role = 'presentation';
                li.innerHTML = `<button class="nav-link ${currentTab === dept ? 'active' : ''}" onclick="switchTab('${dept}')" type="button">${dept}</button>`;
                tabList.appendChild(li);
            });
        }

        function switchTab(dept) {
            currentTab = dept;
            document.querySelectorAll('#deptTabs .nav-link').forEach(btn => {
                if (btn.innerText === dept || (dept === 'All' && btn.id === 'all-tab')) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderTable(document.getElementById('searchInput').value);
        }

        function formatDateThai(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            if (isNaN(date)) return dateStr;
            return date.toLocaleDateString('th-TH', {
                year: '2-digit',
                month: 'short',
                day: 'numeric',
            });
        }

        function renderTable(filter = '') {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let filteredData = documentData;
            
            // Filter by tab
            if (currentTab !== 'All') {
                filteredData = filteredData.filter(item => item.dept === currentTab);
            }

            // Filter by search text
            if (filter) {
                filteredData = filteredData.filter(item => {
                    const searchStr = `${item.bookNum} ${item.name} ${item.dept} ${item.category} ${item.status}`.toLowerCase();
                    return searchStr.includes(filter.toLowerCase());
                });
            }

            filteredData.forEach(item => {
                const key = `${currentPlan}-${item.id}`;
                const tracking = trackingStore[key] || { 
                    step: '', 
                    location: '' 
                };

                const row = document.createElement('tr');
                row.onclick = () => openEdit(key);
                
                // Color coding for steps
                let badgeClass = 'bg-secondary';
                if (tracking.step === 'กวบ.') badgeClass = 'bg-warning text-dark';
                else if (tracking.step === 'ฝบบ.') badgeClass = 'bg-primary';
                else if (tracking.step === 'ส่งกลับกลุ่ม/ฝ่าย') badgeClass = 'bg-success';
                else if (tracking.step === 'กำลังดำเนินการเบิก') {
                    badgeClass = 'bg-primary';
                    row.classList.add('table-primary');
                }
                else if (tracking.step === 'ยกเลิก/ไม่เบิก') {
                    badgeClass = 'bg-danger';
                    row.classList.add('table-danger');
                }

                row.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.bookNum}</td>
                    <td>${item.name}</td>
                    <td>${item.dept}</td>
                    <td><span class="badge ${badgeClass}">${tracking.step || '-'}</span></td>
                    <td>
                        ${formatDateThai(tracking.location)}
                    </td>
                    <td>
                        <small class="text-muted d-block">${item.status ? '[' + item.status + '] ' : ''}</small>
                        ${item.originalNotes || '-'}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

    let datePicker;
    document.addEventListener('DOMContentLoaded', () => {
        datePicker = flatpickr("#editLocation", {
            locale: "th",
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "j M y",
        });
    });

    function openEdit(key) {
        const item = documentData.find(d => `${currentPlan}-${d.id}` === key);
        if (!item) return;

        const tracking = trackingStore[key] || { 
            step: '', 
            location: ''
        };

        document.getElementById('editId').value = key;
        document.getElementById('editStep').value = tracking.step;
        datePicker.setDate(tracking.location);

        const modal = new bootstrap.Modal(document.getElementById('editModal'));
        modal.show();
    }

        // !!! นำ URL ที่ได้จากการ Deploy Google Apps Script มาวางที่นี่ !!!
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzrqrIrK4p4fImNYryIP1cSn9yTngdgDiTg-YECsHCuD7mqatfGCvvt398lJ5qCE-I2zA/exec'; 

        async function saveChanges() {
            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.innerHTML;
            
            const key = document.getElementById('editId').value;
            const step = document.getElementById('editStep').value;
            const location = document.getElementById('editLocation').value;
            const [planId, id] = key.split('-');

            // แสดงสถานะกำลังบันทึก
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> กำลังบันทึก...';

            try {
                // 1. อัปเดตข้อมูลในหน่วยความจำชั่วคราว
                trackingStore[key] = { step, location };

                // 2. ส่งข้อมูลไปบันทึกใน Google Sheet (Database)
                if (APPS_SCRIPT_URL) {
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ planId, id, step, location })
                    });
                    console.log('บันทึกลง Database สำเร็จ');
                }
                
                // ปิด Modal เมื่อบันทึกเสร็จ
                const modalElement = document.getElementById('editModal');
                const modal = bootstrap.Modal.getInstance(modalElement);
                modal.hide();
                
                renderTable(document.getElementById('searchInput').value);
            } catch (error) {
                console.error('ไม่สามารถบันทึกลง Database ได้:', error);
                alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            } finally {
                // คืนค่าปุ่ม
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalText;
            }
        }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        renderTable(e.target.value);
    });

    // Initial load
    switchPlan(currentPlan);
</script>

</body>
</html>
